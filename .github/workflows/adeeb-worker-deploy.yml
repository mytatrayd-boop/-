name: Adeeb — deploy worker

# Deploys the «الأديب الذكي» proxy (apps/adeeb/worker) to Cloudflare Workers.
# Manual only: running this workflow is the owner's approval to deploy.
# Secrets (repo → Settings → Secrets and variables → Actions) — see apps/adeeb/worker/README.md:
#   CLOUDFLARE_API_TOKEN   dash.cloudflare.com → My Profile → API Tokens → template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  dash.cloudflare.com → Workers & Pages → Account ID (right column)
#   ADEEB_GEMINI_API_KEY   aistudio.google.com/apikey (project without billing)
#   ADEEB_DEVICE_SALT      optional: long random text; if absent a fresh random salt is generated
#   ADEEB_IP_SALT          optional: same (a new salt only resets that day's counters)
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "After the health check, ask one real question via /v1/ask (uses 1 Gemini request)"
        type: boolean
        default: true

concurrency: { group: adeeb-worker-deploy, cancel-in-progress: false }

permissions: { contents: read }

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/adeeb/worker } }
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADEEB_GEMINI_API_KEY: ${{ secrets.ADEEB_GEMINI_API_KEY }}
          ADEEB_DEVICE_SALT: ${{ secrets.ADEEB_DEVICE_SALT }}
          ADEEB_IP_SALT: ${{ secrets.ADEEB_IP_SALT }}
        working-directory: .
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADEEB_GEMINI_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v (see apps/adeeb/worker/README.md)"; missing=1; }
          done
          exit $missing

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm, cache-dependency-path: apps/adeeb/worker/package-lock.json }

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

      # wrangler comes from package-lock.json (npm ci), not a floating version.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.txt"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)
          [ -n "$url" ] || { echo "::error::Deployed, but no workers.dev URL found in wrangler output"; exit 1; }
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
          echo "Worker URL: $url"

      # After deploy so the first run also works (the Worker must exist). The JSON is
      # built by jq from the environment and piped to stdin: values never appear in
      # argv, files, or the log.
      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADEEB_GEMINI_API_KEY: ${{ secrets.ADEEB_GEMINI_API_KEY }}
          ADEEB_DEVICE_SALT: ${{ secrets.ADEEB_DEVICE_SALT }}
          ADEEB_IP_SALT: ${{ secrets.ADEEB_IP_SALT }}
        run: |
          set -o pipefail
          # Salts are optional: generate random ones if the secrets are not set.
          [ -n "$ADEEB_DEVICE_SALT" ] || ADEEB_DEVICE_SALT=$(openssl rand -hex 32)
          [ -n "$ADEEB_IP_SALT" ] || ADEEB_IP_SALT=$(openssl rand -hex 32)
          export ADEEB_DEVICE_SALT ADEEB_IP_SALT
          jq -n 'env | {GEMINI_API_KEY: .ADEEB_GEMINI_API_KEY, DEVICE_SALT: .ADEEB_DEVICE_SALT, IP_SALT: .ADEEB_IP_SALT}' \
            | npx wrangler secret bulk

      - name: Health check
        run: |
          echo "Worker URL: $WORKER_URL"
          # A brand-new workers.dev subdomain can take a minute to resolve.
          for i in $(seq 1 12); do
            out=$(curl -sS --max-time 10 "$WORKER_URL/v1/health" || true)
            if echo "$out" | grep -q '"ok":true'; then
              echo "health: $out"
              echo "### Adeeb worker: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i: ${out:-no response}"; sleep 10
          done
          echo "::error::$WORKER_URL/v1/health did not return {\"ok\":true}"
          exit 1

      # Optional end-to-end check: one real question (eval q04) with a real paragraph
      # from library/ (not text typed here), shaped exactly like the app's request
      # (lib/ask/ask_api.dart) and worker/src/validate.ts: headers X-Client and a fresh
      # random UUID v4 X-Device-Id, body {v, lang, question, passages[{id, book,
      # chapter, text}]} with no extra keys. Uses one Gemini request.
      # Fails only when the Worker says our request or itself is broken (400/426/500
      # and other unexpected statuses). Quota or overload (429/503) and network
      # errors are warnings: the deploy itself already succeeded.
      # Prints only the status, the response code, and a short answer excerpt.
      - name: Smoke test /v1/ask
        if: inputs.smoke
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/ask-body.json"
          out="$RUNNER_TEMP/ask-response.json"
          rm -f "$out"
          python3 - "$body" <<'PY'
          import gzip, json, sys
          lib = "../library/"
          question = next(q for q in json.load(open(lib + "eval/questions.json", encoding="utf-8"))["questions"] if q["id"] == "q04")
          target = question["expected"][0]                # e.g. bayan-b002-p00002
          book_id = target.split("-")[0]
          entry = next(b for b in json.load(open(lib + "catalog.json", encoding="utf-8"))["books"] if b["id"] == book_id)
          book = json.load(gzip.open(lib + entry["file"], "rt", encoding="utf-8"))
          passages = []
          for chapter in book["chapters"]:
              paras = chapter.get("paragraphs", [])
              for i, p in enumerate(paras):
                  if p["id"] == target:
                      # The target plus the paragraph before it, as the retriever might send.
                      for q in paras[max(i - 1, 0):i + 1]:
                          passages.append({
                              "id": q["id"],
                              "book": book["title"]["ar"][:200],
                              "chapter": chapter["title"][:200],
                              "text": q["text"][:1500],         # MAX_PASSAGE_CHARS
                          })
          assert passages, f"paragraph {target} not found"
          json.dump({"v": 1, "lang": "ar", "question": question["question"], "passages": passages},
                    open(sys.argv[1], "w", encoding="utf-8"), ensure_ascii=False)
          print("question:", question["question"], "| passages:", ", ".join(p["id"] for p in passages))
          PY
          build=$(sed -nE 's/^const clientBuildNumber = ([0-9]+);.*/\1/p' ../lib/core/client_info.dart)
          device=$(python3 -c 'import uuid; print(uuid.uuid4())')
          status=$(curl -sS --max-time 45 -o "$out" -w '%{http_code}' -X POST "$WORKER_URL/v1/ask" \
            -H 'Content-Type: application/json; charset=utf-8' -H 'Accept: application/json' \
            -H "X-Client: adeeb-android/${build:-1}" -H "X-Device-Id: $device" \
            --data-binary @"$body") || status=000
          echo "HTTP status: $status"
          python3 - "$out" <<'PY' || true
          import json, sys
          try:
              r = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("response: not JSON"); sys.exit(0)
          if "found" in r:
              print("found:", r.get("found"), "| citations:", len(r.get("citations") or []),
                    "| remaining:", r.get("remaining"), "| reason:", r.get("reason", "-"))
              print("answer:", (r.get("answer") or "")[:240])
              for c in (r.get("citations") or [])[:3]:
                  print("  cite", c.get("paragraph_id"), ":", (c.get("quote") or "")[:80])
          else:
              print("code:", r.get("code"), "| retry_after:", r.get("retry_after", "-"), "| remaining:", r.get("remaining", "-"))
          PY
          case "$status" in
            200)
              python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(r.get("found"), bool) and isinstance(r.get("citations"), list) else 1)' "$out" \
                || { echo "::error::200 but the body is not {found, answer, citations, remaining}"; exit 1; }
              echo "### Smoke /v1/ask: HTTP 200" >> "$GITHUB_STEP_SUMMARY" ;;
            429|503)
              echo "::warning::/v1/ask returned $status (Gemini quota/overload or Worker limit). Not a request-shape problem; deploy is fine."
              echo "### Smoke /v1/ask: HTTP $status (quota/unavailable, not failed)" >> "$GITHUB_STEP_SUMMARY" ;;
            000)
              echo "::warning::/v1/ask: no response (network/timeout)." ;;
            *)
              echo "::error::/v1/ask returned $status: the request shape (400/426) or the Worker (500 etc.) is wrong."
              exit 1 ;;
          esac
