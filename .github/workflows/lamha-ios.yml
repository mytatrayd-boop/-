name: Lamha — iOS (TestFlight)

# «لمحة» لآيفون مع ودجتها (LamhaWidget). عند كل push على apps/lamha: بناء بلا توقيع للتأكد من ترجمة
# التطبيق والودجت. التشغيل اليدوي: توقيع تلقائي بمفتاح App Store Connect API (نفس أسرار «أسرتي» و«موعد»)
# ورفع إلى App Store Connect فيظهر في TestFlight. لا يُرسل شيء للمراجعة أو النشر العام.
# قبل أول تشغيل يدوي: App Group باسم group.sa.lamha.shared مفعّلة للمعرّفين (apps/lamha/RELEASE.md).
on:
  push:
    paths: ['apps/lamha/**', '.github/workflows/lamha-ios.yml', '.github/scripts/ios_signing.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/lamha } }
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Check secrets
        if: env.UPLOAD == 'true'
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in KEY KEY_ID ISSUER TEAM; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see asraty/docs/RELEASE.md step 5)"; exit 1; }; done

      - run: flutter pub get

      - name: Flutter build (no codesign, app + widget)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Write API key
        if: env.UPLOAD == 'true'
        env: { KEY: "${{ secrets.APPSTORE_API_KEY_P8 }}" }
        run: printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Signing (temporary distribution certificate + App Store profiles)
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CAPABILITIES: APP_GROUPS
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ios_signing.py" setup sa.lamha.lamha,sa.lamha.lamha.LamhaWidget ios/Runner.xcodeproj/project.pbxproj "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        if: env.UPLOAD == 'true'
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive

      - name: Export and upload to App Store Connect
        if: env.UPLOAD == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - name: Remove local signing keychain
        if: always() && env.UPLOAD == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ios_signing.py" cleanup

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
