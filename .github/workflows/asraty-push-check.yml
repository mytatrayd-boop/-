name: Asraty — push check (read-only)

# Diagnoses why a parent gets no notifications: lists, per family, each
# person's role, permissions and registered devices, and asks FCM about each
# parent's device in a dry run. Sends nothing to anyone and changes no data —
# unless owner_email_sha256 is given (only with the owner's approval): then it also
# sends ONE test notification («اختبار من أسرتي») to that owner's family only.
on:
  workflow_dispatch:
    inputs:
      owner_email_sha256:
        description: "Optional: sha256 of a family owner's email to send that family one real test notification"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asraty/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: asraty/functions/package-lock.json }
      - run: npm ci
      - name: Service account
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: node scripts/push-check.mjs
      - if: inputs.owner_email_sha256 != ''
        run: node scripts/push-test.mjs
        env: { OWNER_EMAIL_SHA256: "${{ inputs.owner_email_sha256 }}" }
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
