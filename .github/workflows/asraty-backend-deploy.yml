name: Asraty — deploy backend

# Deploys the Firestore security rules to Firebase (free Spark plan is enough)
# and the API server to Vercel (free). Secrets — see asraty/docs/RELEASE.md:
#   FIREBASE_SERVICE_ACCOUNT_JSON  Firebase → Project settings → Service accounts → Generate new private key
#   VERCEL_TOKEN                   vercel.com → Account settings → Tokens
#   GMAIL_USER, GMAIL_APP_PASSWORD Gmail address + app password used to send login codes
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asraty/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: asraty/functions/package-lock.json }

      - name: Check secrets
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          missing=0
          for v in FIREBASE_SERVICE_ACCOUNT_JSON VERCEL_TOKEN GMAIL_USER GMAIL_APP_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v (see asraty/docs/RELEASE.md)"; missing=1; }
          done
          exit $missing

      - run: npm ci
      - run: npm run build

      - name: Service account
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"
          echo "SA_B64=$(base64 -w0 "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"
          echo "::add-mask::$(base64 -w0 "$RUNNER_TEMP/sa.json")"

      - name: Deploy Firestore rules
        working-directory: asraty
        run: npx -y firebase-tools@15 deploy --only firestore --project "$PROJECT_ID" --non-interactive

      - name: Deploy API to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          npx -y vercel@latest link --yes --project asraty-server --token "$VERCEL_TOKEN"
          URL=$(npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            -e FIREBASE_SERVICE_ACCOUNT_B64="$SA_B64" \
            -e GMAIL_USER="$GMAIL_USER" \
            -e GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" \
            -e SUPPORT_EMAIL="asraty200@gmail.com")
          echo "Deployment: $URL"
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
          npx -y vercel@latest project inspect asraty-server --token "$VERCEL_TOKEN" || true

      - name: Smoke test
        run: |
          out=$(curl -sS -X POST "$DEPLOY_URL/api/requestCode" -H 'Content-Type: application/json' -d '{"data":{"email":"not-an-email","role":"member"}}')
          echo "$out"
          echo "$out" | grep -q '"bad-email"' || { echo "::error::API did not answer as expected"; exit 1; }
          curl -sS -o /dev/null -w "privacy page: %{http_code}\n" "$DEPLOY_URL/privacy"
