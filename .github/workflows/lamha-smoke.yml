name: Lamha — Android smoke (release on emulator)

# تشخيص: يبني نسخة الإصدار (R8 وتصغير الموارد كما في Google Play، بتوقيع debug) ويشغّلها على محاكي أندرويد،
# ويطبع سجل الأعطال في الـ job. يعمل بـ push على فرع العمل أو يدوياً. لا يرفع شيئاً.
on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-g614ew]
    paths: ['.github/workflows/lamha-smoke.yml', '.github/scripts/lamha_smoke.sh', 'apps/lamha/android/**']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/lamha } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - run: flutter build apk --release
      # النسخة القديمة (آخر إصدار أندرويد قبل 1.1.0) لاختبار التحديث فوقها بإعداداتها المحفوظة.
      - name: Build old version (1.0.x, commit 4eb6215)
        working-directory: .
        run: |
          git worktree add ../old 4eb6215
          cd ../old/apps/lamha
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/apps/lamha/old.apk"
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/lamha
          script: bash ../../.github/scripts/lamha_smoke.sh build/app/outputs/flutter-apk/app-release.apk old.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lamha-smoke-${{ github.run_number }}
          path: apps/lamha/smoke/
          if-no-files-found: warn
