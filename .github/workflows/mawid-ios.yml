name: Mawid — iOS (TestFlight)

# يبني «موعد» لآيفون ويوقّعه تلقائياً بمفتاح App Store Connect API ويرفعه إلى
# App Store Connect فيظهر في TestFlight. نفس أسرار «أسرتي» (انظر apps/mawid/RELEASE.md).
# التشغيل يدوي فقط، ولا يُرسل شيء للمراجعة أو النشر العام.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/mawid } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Check secrets
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in KEY KEY_ID ISSUER TEAM; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see asraty/docs/RELEASE.md step 5)"; exit 1; }; done

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write API key
        env: { KEY: "${{ secrets.APPSTORE_API_KEY_P8 }}" }
        run: printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Flutter build (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - name: Export and upload to App Store Connect
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" ios/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
