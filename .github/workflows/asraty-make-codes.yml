name: Asraty — make activation codes

# Makes free-use activation codes (one device each) and emails them to the
# support address (asraty200@gmail.com). Codes never appear in this log: the
# repository is public, so only their hashes are stored in Firestore.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many codes (1–200)"
        default: "10"
      note:
        description: "Optional note sent with the codes (who they are for)"
        default: ""

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asraty/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: asraty/functions/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Service account
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Make codes
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPPORT_EMAIL: asraty200@gmail.com
          COUNT: ${{ inputs.count }}
          NOTE: ${{ inputs.note }}
        run: node scripts/make-codes.mjs "$COUNT" "$NOTE"
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
