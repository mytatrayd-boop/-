# اعتمده المالك (إذن مسبق). ملفات l10n تبقى متتبَّعة (D13)؛ gen-l10n هنا للتحقق فقط.
name: rihla-ci
on:
  workflow_dispatch:
  push:
    paths: ['apps/rihla/**', '.github/workflows/rihla-ci.yml']
  pull_request:
    paths: ['apps/rihla/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rihla
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: bash tool/check_no_secrets.sh
