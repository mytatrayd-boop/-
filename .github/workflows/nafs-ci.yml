name: Nafs — tests

# منصة نواتج التعلم (apps/nafs): اختبارات المنطق وقواعد Firestore وتجربة كاملة في Chrome على محاكيات Firebase.
on:
  push:
    paths: [apps/nafs/**, .github/workflows/nafs-*.yml]
  pull_request:
    paths: [apps/nafs/**, .github/workflows/nafs-*.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/nafs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/nafs/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
