name: Asraty — deploy Firebase backend

# Deploys Cloud Functions, Firestore/Storage rules and indexes, and the privacy
# page (Firebase Hosting). Needs FIREBASE_SERVICE_ACCOUNT_JSON and
# FIREBASE_PROJECT_ID secrets — see asraty/docs/RELEASE.md.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asraty } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: asraty/functions/package-lock.json }
      - run: npm ci
        working-directory: asraty/functions
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" }
      - name: Email settings
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          if [ -n "$MAIL_FROM" ]; then printf 'MAIL_FROM=%s\n' "$MAIL_FROM" > functions/.env; fi
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx --prefix functions firebase functions:secrets:set RESEND_API_KEY --data-file=- --project "${{ secrets.FIREBASE_PROJECT_ID }}" --force --non-interactive
          fi
      - name: Deploy
        run: npx --prefix functions firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only functions,firestore,storage,hosting --force --non-interactive
