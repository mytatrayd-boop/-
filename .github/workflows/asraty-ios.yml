name: Asraty — iOS (TestFlight)

# Archives, signs (temporary distribution certificate made with the App Store Connect API key, revoked after upload) and
# uploads the build to App Store Connect, where it appears in TestFlight.
# Required secrets are listed in asraty/docs/RELEASE.md.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults: { run: { working-directory: asraty/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Check secrets
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in KEY KEY_ID ISSUER TEAM; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see asraty/docs/RELEASE.md)"; exit 1; }; done

      - name: Write build config and API key
        env:
          ASRATY_ENV_JSON: ${{ secrets.ASRATY_ENV_JSON }}
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          if [ -n "$ASRATY_ENV_JSON" ]; then printf '%s' "$ASRATY_ENV_JSON" > env.json; else cp env.prod.json env.json; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Flutter build (no codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=env.json --build-number=${{ github.run_number }}

      - name: Signing (temporary distribution certificate + App Store profile)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ios_signing.py" setup sa.asraty.app ios/Runner.xcodeproj/project.pbxproj "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive

      - name: Export and upload to App Store Connect
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - name: Revoke temporary certificate
        if: always()
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ios_signing.py" cleanup

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
