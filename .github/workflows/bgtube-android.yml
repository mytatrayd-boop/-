name: BGTube — Android signed APK

# يبني APK release لـ BGTube (استخدام شخصي، بلا متجر) موقّعاً بالمفتاح الثابت نفسه المحفوظ في أسرار المستودع
# (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) — طريقة lamha-play.yml.
# يطبع بصمة SHA-1 وSHA-256 للشهادة (عامة)، ويرفع الـAPK كـ artifact فقط. لا نشر.
on:
  push:
    branches: [ccr-6f5d04ba-q43hrh]
    paths: ['apps/bgtube/**', '.github/workflows/bgtube-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/bgtube } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.50.1', cache: true } # التطبيق مبني على Flutter 3.50.1 / Dart 3.14

      - name: Decode signing keystore
        env: { ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::سر ANDROID_KEYSTORE_BASE64 غير موجود في المستودع"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # البصمة عامة وليست سراً: نطبع أسطر SHA1/SHA256 فقط (كلمة المرور عبر متغير بيئة، لا تظهر في السجل).
      - name: Print signing certificate fingerprints
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD > "$RUNNER_TEMP/keytool.txt"
          grep -E '^\s*SHA(1|256):' "$RUNNER_TEMP/keytool.txt"
          rm -f "$RUNNER_TEMP/keytool.txt"

      - run: flutter pub get
      - run: flutter test

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # تحقق أن الـAPK موقّع بالمفتاح الثابت لا بمفتاح debug.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E 'SHA-1|SHA-256|DN'
          if "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q 'CN=Android Debug'; then
            echo "::error::الـAPK موقّع بمفتاح debug"; exit 1
          fi

      - run: cp build/app/outputs/flutter-apk/app-release.apk bgtube-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: "bgtube-apk-${{ github.run_number }}"
          path: apps/bgtube/bgtube-release.apk
          if-no-files-found: error
