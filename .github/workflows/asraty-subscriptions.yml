name: Asraty — App Store subscriptions

# Creates / completes the Asraty subscription products in App Store Connect with the API key
# (same secrets as asraty-ios.yml). "inspect" only reads; "apply" creates what is missing.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "which app's products"
        type: choice
        options: [asraty, lamha]
        default: asraty
      mode:
        description: "inspect = read only, apply = create what is missing"
        type: choice
        options: [inspect, apply]
        default: inspect

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          SPEC_FILE: .github/scripts/${{ inputs.app }}_subscriptions.json
        run: |
          for v in KEY ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }; done
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          python3 .github/scripts/asc_subscriptions.py "${{ inputs.mode }}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
