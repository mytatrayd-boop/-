name: Asraty — push test (sends one real notification)

# Sends ONE test notification («اختبار من أسرتي») to every device of a single family,
# chosen by the sha256 of its owner's email, and prints what FCM answered per device.
# Run only with the owner's approval. Changes no data.
on:
  workflow_dispatch:
    inputs:
      owner_email_sha256:
        description: "sha256 of the family owner's email (lowercase, trimmed)"
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asraty/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: asraty/functions/package-lock.json }
      - run: npm ci
      - name: Service account
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: node scripts/push-test.mjs
        env: { OWNER_EMAIL_SHA256: "${{ inputs.owner_email_sha256 }}" }
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
