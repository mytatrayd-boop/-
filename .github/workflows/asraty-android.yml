name: Asraty — Android (Google Play internal testing)

# Builds a signed App Bundle. If PLAY_SERVICE_ACCOUNT_JSON is set, uploads it to
# Google Play. The very first upload of a new app must be done by hand in Play
# Console (download the .aab from this run's artifacts). See asraty/docs/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        default: internal
        type: choice
        options: [internal, alpha, beta]
      status:
        description: "Release status (use 'draft' until the app has passed its first review)"
        default: completed
        type: choice
        options: [completed, draft]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asraty/app } }
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Write build config
        env: { ASRATY_ENV_JSON: "${{ secrets.ASRATY_ENV_JSON }}" }
        run: |
          if [ -n "$ASRATY_ENV_JSON" ]; then printf '%s' "$ASRATY_ENV_JSON" > env.json; else cp env.prod.json env.json; fi

      - name: Upload key
        env: { ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see asraty/docs/RELEASE.md)"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define-from-file=env.json --build-number=${{ github.run_number }}

      # Universal APK for direct install on phones where the Play test link fails
      # (signed with the upload key, so it cannot update a Play-installed copy).
      - name: Build APK (direct install)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=env.json --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: asraty-aab-${{ github.run_number }}
          path: asraty/app/build/app/outputs/bundle/release/app-release.aab

      - name: Publish on the Releases page (direct download link)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="asraty-android-${{ github.run_number }}"
          cp build/app/outputs/bundle/release/app-release.aab "asraty-${{ github.run_number }}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "asraty-${{ github.run_number }}.apk"
          gh release create "$tag" "asraty-${{ github.run_number }}.aab" "asraty-${{ github.run_number }}.apk" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "أسرتي — Android build ${{ github.run_number }}" \
            --notes "ملف .aab للرفع على Google Play (Internal testing)، وملف .apk للتثبيت المباشر على الجوال." --prerelease
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$tag/asraty-${{ github.run_number }}.aab"
          echo "APK: https://github.com/${{ github.repository }}/releases/download/$tag/asraty-${{ github.run_number }}.apk"

      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: sa.asraty.app
          releaseFiles: asraty/app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
