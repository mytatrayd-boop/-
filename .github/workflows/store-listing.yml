name: Store listing (Google Play + App Store)

# صفحة المتجر لأي تطبيق من stores/apps.json: النصوص والصور، وفي أبل أيضاً التصنيف العمري
# وملاحظات المراجع واختيار النسخة. المصدر <app_dir>/store/metadata و<app_dir>/store/{play,appstore}.
# التشغيل يدوي (مدير المتاجر). يعدّل صفحة المتجر فقط، إلا إذا اختير submit_review فيرسل نسخة آيفون
# لمراجعة أبل (بكلمة «ارفع» من المالك لهذا التطبيق وهذه النسخة).
# mode=dry-run يقرأ ويتحقق ولا يغيّر شيئاً.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "اسم التطبيق كما في stores/apps.json (مثل لمحة)"
        required: true
        default: لمحة
      store:
        description: "المتجر"
        type: choice
        default: both
        options: [both, google, apple]
      mode:
        description: "dry-run يتحقق فقط، apply يحدّث الصفحة"
        type: choice
        default: dry-run
        options: [dry-run, apply]
      build:
        description: "آيفون: رقم build يُربط بالنسخة القابلة للتعديل (اختياري)"
        required: false
        default: ""
      submit_review:
        description: "آيفون: أرسل النسخة لمراجعة App Store بعد التحديث (بموافقة المالك فقط)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      store_dir: ${{ steps.app.outputs.store_dir }}
      android: ${{ steps.app.outputs.android }}
      ios: ${{ steps.app.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: app
        env: { APP: "${{ inputs.app }}" }
        run: |
          python3 - <<'EOF'
          import json, os, sys
          apps = {a["name"]: a for a in json.load(open("stores/apps.json"))}
          a = apps.get(os.environ["APP"])
          if not a:
              sys.exit(f"::error::Unknown app {os.environ['APP']}; known: {', '.join(apps)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"store_dir={a['app_dir']}/store\nandroid={a['android']}\nios={a['ios_bundle']}\n")
          EOF

  google:
    needs: resolve
    if: inputs.store != 'apple'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: python3 .github/scripts/play_listing.py ${{ needs.resolve.outputs.android }} ${{ needs.resolve.outputs.store_dir }} --check
      - name: Google Play listing
        env: { PLAY_SERVICE_ACCOUNT_JSON: "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" }
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::Missing secret PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }
          python3 .github/scripts/play_listing.py ${{ needs.resolve.outputs.android }} ${{ needs.resolve.outputs.store_dir }} \
            ${{ inputs.mode == 'dry-run' && '--dry-run' || '' }}

  apple:
    needs: resolve
    if: inputs.store != 'google'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: python3 .github/scripts/appstore_listing.py ${{ needs.resolve.outputs.ios }} ${{ needs.resolve.outputs.store_dir }} --check
      - name: Write API key
        env: { KEY: "${{ secrets.APPSTORE_API_KEY_P8 }}" }
        run: |
          [ -n "$KEY" ] || { echo "::error::Missing secret APPSTORE_API_KEY_P8"; exit 1; }
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: App Store page
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_REVIEW_FIRST_NAME: ${{ secrets.ASC_REVIEW_FIRST_NAME }}
          ASC_REVIEW_LAST_NAME: ${{ secrets.ASC_REVIEW_LAST_NAME }}
          ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
          BUILD: ${{ inputs.build }}
          SUBMIT: ${{ inputs.submit_review && inputs.mode == 'apply' && '--submit' || '' }}
        run: |
          python3 .github/scripts/appstore_listing.py ${{ needs.resolve.outputs.ios }} ${{ needs.resolve.outputs.store_dir }} \
            ${{ inputs.mode == 'dry-run' && '--dry-run' || '' }} ${BUILD:+--build "$BUILD"} $SUBMIT
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
