name: Asraty — diagnose addTask

on:
  workflow_dispatch:
  push:
    branches: [ccr-c755e616-4x68g8]
    paths: [asraty/functions/scripts/diag-addtask.mjs, .github/workflows/asraty-diag.yml]

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: asraty/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Service account
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Call addTask on the live server
        run: |
          export SERVER_URL=$(jq -r .SERVER_URL ../app/env.prod.json) API_KEY=$(jq -r .FIREBASE_API_KEY ../app/env.prod.json)
          node scripts/diag-addtask.mjs
