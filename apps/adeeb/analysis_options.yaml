include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - library/**
    - worker/**
    - voice_lab/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_dynamic_calls
    - unawaited_futures
