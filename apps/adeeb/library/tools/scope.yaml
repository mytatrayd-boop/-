# نطاق المكتبة الكبيرة (D30، ARCHITECTURE §18.2) وحدود بوابات الجودة (§18.3).
# يقرؤه bin/select.dart وbin/convert.dart --auto. كل تعديل هنا مراجَع في git.
#
# القاعدة: status=pri، language=ara، uncorrected_OCR=False، المؤلف توفي ≤ 1300هـ،
# وفي الوسوم وسم من include_tags وليس فيها وسم من exclude_tags.
# كل وسم يُحسم وحده بالإدراج أولاً: «Shamela@الغريب والمعاجم ولغة الفقه» وسم لغة لا فقه.
# المختلط (وسم إدراج + وسم استبعاد) يُستبعد بسبب «mixed» حتى يُحسم بالاسم في include_books/exclude_books.
# الأنماط تعابير نمطية (Dart RegExp) تطابق الوسم كاملاً كما في TSV، مثل «JK@كتب التاريخ».

release:
  repo: OpenITI/RELEASE
  tag: v2025.1.9
  commit: cfc4157a3cf2054c0888f133970a4eaa3e22e58c
  metadata: metadata/OpenITI_metadata_2025-1-9.tsv
  metadata_sha256: 10a025fcfc1bf96d218096f0dfe1d9416f9ff277f092c42622cb012cc4da2a61

filters:
  status: pri
  language: ara
  uncorrected_ocr: false
  max_death_hijri: 1300

include_tags:
  # الأدب والبلاغة والنقد والأمثال والطرائف
  - '@(.*[ ])?(ال)?أدب([ ]|$)'
  - '@.*(البلاغة|الفصاحة|الأمثال|الطرائف|القصص|النوادر)'
  # الشعر والدواوين والعروض
  - '@.*(الشعر|دواوين|الدواوين|العروض)'
  - '^_SHICR'
  - '^GAL@(poetry|prose|philology|literature-popular|adab)$'
  # اللغة والمعاجم والغريب والنحو والصرف
  - '@.*(النحو|الصرف|نحوية|اللغة|اللغوي|الغريب)'
  - '@(ال)?معاجم'
  - '^KITAB@lexicographical'
  - '^GAL@(grammar|lexicography)$'
  # التاريخ والأخبار والتراجم والطبقات والأنساب والسيرة العامة
  - '@.*(التاريخ|تاريخية|التواريخ|تواريخ|الأخبار|التراجم|الطبقات|الوفيات|الأنساب|السيرة|سيرة|السير والتاريخ)'
  - '^GAL@(history|historiography|history-local|history-universal|biography|biography-collective|genealogy)$'
  # البلدان والجغرافيا والرحلات وأيام العرب
  - '@.*(البلدان|الجغرافيا|الرحلات|رحلة|أيام العرب)'
  - '^GAL@(geography|cosmography)$'

exclude_tags:
  # الحديث ورجاله
  - '@.*(حديث|الرواة|رجال|الضعفاء|الضعيفة|الثقات|العلل|السؤالات|التخريج|الزوائد|المسانيد|السنن|المصنفات والآثار|مصطلح|مصطح|المسندة|مسندة|الأمالي)'
  # الفقه وأصوله والفتاوى والقضاء
  - '@.*(فقه|فقهية|أصول|الفتاوى|فتاوى|القضاء|السياسة الشرعية)'
  # التفسير وعلوم القرآن والقراءات
  - '@.*(التفسير|التفاسير|القرآن|القراءات)'
  # العقيدة والفرق والردود
  - '@.*(العقيدة|العقائد|عقدية|التوحيد|الفرق والملل|الردود|ردود)'
  # الرقائق والأذكار والتصوف والسلوك
  - '@.*(الرقاق|الأذكار|الأدعية|التصوف|السلوك|التزكية|الأخلاق)'
  # مجموعات مؤلفين خارج النطاق
  - '@.*(ابن تيمية|ابن القيم|الألباني|ابن أبي الدنيا)'
  - '^GAL@(fiqh|hadith|hadith-sciences|sciences-hadith|cilm-rijal|quran|quran-sciences|tafsir|dogmatics|theology|sufism|mysticism|usul)$'
  # وسم الحديث الموضوعي في OpenITI («ذكر المدلسين»، «تلخيص المتشابه»)
  - '^_HADITH$'

# كتب مختلطة حُسمت بالاسم: URI الكتاب ← السبب.
include_books:
  # طابقت أنماط exclude_titles وهي تاريخ وتراجم عامة لا حديث ولا مناقب.
  0350MuhammadKindi.FadailMisr: 'تاريخ وبلدان: فضائل مصر (exclude_titles devotional)'
  0464AbuBakrMaliki.RiyadNufus: 'تراجم: طبقات علماء القيروان (exclude_titles devotional)'
  0809IbnQunfudh.Wafayat: 'تراجم: وفيات عامة (exclude_titles rijal)'
exclude_books:
  0385Daraqutni.MutalifWaMukhtalif: 'رجال: المؤتلف والمختلف في أسماء الرواة'
  0409CabdGhaniAzdi.MutalifWaMukhtalif: 'رجال: المؤتلف والمختلف في أسماء الرواة'
  0378HakimKabir.AsamiWaKuna: 'رجال: كنى الرواة'
  0374IbnHusaynAzdi.DhikrIsmKullAshab: 'رجال: الصحابة الرواة'
  0470IbnMandaCabdRahman.Mustakhraj: 'رجال: أحوال الرجال'
  0748Dhahabi.Amsar: 'حديث: الأمصار ذوات الآثار'
  0700IbnYusufIbnJabar.NahjIman: 'عقيدة: الإمامة'
  0902Sakhawi.SirrMaktum: 'فقه/رقائق: المال المحمود والمذموم'
  1206IbnCabdWahhab.BacdFawaidSulhHudaybiyya: 'فقه: فوائد صلح الحديبية'
  0568MuwaffaqKhwarazmi.Manaqib: 'مناقب'
  0597IbnJawzi.MuthirGharam: 'فضائل: الحرمين (حديث ومناسك)'

# عناوين خارج النطاق لا تكشفها الوسوم (أول دفعة 100 كتاب: «تعليقات الدارقطني على المجروحين»،
# «طبقات علماء الحديث»، «الدر النقي في شرح ألفاظ الخرقي»). الفئة ← نمط على title_ar.
# غريب الحديث والقرآن وإعراب ألفاظ الحديث كتب لغة فتبقى؛ وكذلك طبقات الفقهاء والقضاة (تراجم).
exclude_titles:
  rijal: 'المجروحين|الضعفاء|الثقات|الجرح والتعديل|معرفة الرجال|أسماء الرجال|رجال سنن|المدلسين|المحدثين|علماء الحديث|الحفاظ|المتروكين|معجم الشيوخ|معجم شيوخ|(?<![ء-ي])(ب)?شيوخ (أبي|مالك|البخاري)|مشيخة|رواة السنن|المتشابه في الرسم|مشتبه النسبة|علم الحديث'
  hadith: '(?<![ء-ي])(السنن|سنن|المسند|مسند|الأربعين|الأربعون|الموطأ|صحيح|الجامع الصحيح|الأحاديث|أحاديث|تخريج)(?![ء-ي])'
  devotional: 'الصلاة على|الصلوات|صلوات|الأذكار|الأدعية|الأوراد|(?<![ء-ي])(دعاء|مولد|المولد|زيارة)(?![ء-ي])|(?<!ال)مناقب|فضائل|فضل (آل|زيارة)|الشمائل|شمائل|خصائص سيد|بالنبي عليه الصلاة|الرقائق|الزهد|كرامات'
  fiqh: '(?<![ء-ي])(الفقه|فقه)(?! اللغة)(?![ء-ي])|ألفاظ الخرقي|ألفاظ المهذب|حلية الفقهاء|أحكام النساء|الفتاوى|فتاوى|الفرائض|المناسك'
  tafsir: '(?<![ء-ي])(تفسير القرآن|التفسير|أسباب النزول|الناسخ والمنسوخ|القراءات)(?![ء-ي])'

# URI الكتاب ← URI النسخة المختارة بدل pri (استثناء يدوي).
version_overrides: {}

# حدود بوابات الجودة (ARCHITECTURE §18.3)، ضُبطت على الكتب الخمسة المراجَعة يدوياً.
gates:
  unknown_per_10k_reject: 5
  unknown_per_10k_review: 1
  footnote_per_10k_reject: 20
  footnote_per_10k_review: 3
  removed_ratio_reject: 0.15
  removed_ratio_review: 0.05
  latin_ratio_reject: 0.01
  latin_ratio_review: 0.002
  duplicate_ratio_reject: 0.03
  duplicate_ratio_review: 0.015   # البيان 1.15%: أبيات وأخبار يكررها الجاحظ نفسه
  # الفقرات الأقصر من هذا لا تُعدّ في بوابة التكرار (لازمة أو شطر يتكرر في نص المؤلف).
  duplicate_min_chars: 40
  max_paragraph_chars: 20000
  min_words: 1000
  # أول 2% من النص يُبحث فيه عن أثر مقدمة محقق أو ناشر.
  editor_head_ratio: 0.02
  # «تحقيق» وحدها كلمة عامة («تحقيق الفقهاء» في مقدمة الماوردي)؛ المطلوب صيغ الطبعات.
  editor_words: '(?<![ء-ي])(تحقيق\s*[:،/]|بتحقيق|تحقيق ودراسة|دراسة وتحقيق|حققه|وحققه|قدم له|وقدم له|الطبعة)(?![ء-ي])'
  # كشف البنية: أقل من هذا لكل 100 ألف كلمة ← أبواب مولّدة (الجزء/القسم).
  min_headings_per_100k_words: 2
  generated_section_paragraphs: 150
