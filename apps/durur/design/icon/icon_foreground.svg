<?xml version="1.0" encoding="UTF-8"?>
<!--
  ديرة الدرور — الطبقة الأمامية للأيقونة التكيفية في أندرويد
  1024×1024 = 108dp، خلفية شفافة.
  كل الرسم داخل دائرة المنطقة الآمنة: نصف قطر الرسم الأقصى ≈ 299px
  (قطر 598px ≈ 58% من العرض)، أقل من 66dp/108dp (626px) ومن 66% (676px).
  لون طبقة الخلفية: #1B2A4A (solid color).
  نفس رسم icon.svg مصغّراً 0.9 حول المركز.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ديرة الدرور</title>
