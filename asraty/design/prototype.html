<style>
:root{
  --bg:#F6F2E8;--card:#FFFFFF;--ink:#1E302C;--muted:#66736F;--line:#E7E1D2;
  --brand:#2F6158;--brand-ink:#2F6158;--sun:#D9B26A;--sun-deep:#B8893A;
  --mint:#2E9E78;--mint-bg:#E3F4EC;--red:#C8424A;--red-bg:#FBE9EA;--wait:#FBF1DA;--wait-ink:#8A6414;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111A18;--card:#1A2522;--ink:#EEF2EF;--muted:#A5B3AE;--line:#2A3833;
  --brand-ink:#8FD1BE;--mint-bg:#123A30;--red-bg:#3A1A22;--wait:#3A3218;--wait-ink:#F0CF86;
}}
:root[data-theme="dark"]{
  --bg:#111A18;--card:#1A2522;--ink:#EEF2EF;--muted:#A5B3AE;--line:#2A3833;
  --brand-ink:#8FD1BE;--mint-bg:#123A30;--red-bg:#3A1A22;--wait:#3A3218;--wait-ink:#F0CF86;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}
header{background:var(--brand);color:#fff;padding:16px 16px 54px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
header>.top,header>.me{position:relative;z-index:1}
.fam{max-width:560px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center}
.fam::-webkit-scrollbar{display:none}
.ring{flex:none;position:relative;width:80px;height:80px}
.rt{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rt text{fill:#fff;font-weight:700;font-family:Tajawal,sans-serif}
.ri{position:absolute;left:50%;top:50%;width:57%;height:57%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ri svg,.av svg,.mini svg,.avopt svg{width:100%;height:100%;display:block}
.ring.inv{opacity:.55}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.avopt{border:3px solid transparent;border-radius:50%;padding:0;background:none;aspect-ratio:1;overflow:hidden}
.avopt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--sun)}
.avbtn{border:0;padding:0;position:relative;cursor:pointer}
.avbtn{overflow:visible}.avbtn svg{border-radius:50%}
.cam{position:absolute;bottom:-3px;inset-inline-start:-3px;width:20px;height:20px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mini{display:inline-block;width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-inline-end:6px;overflow:hidden}
.mebtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 12px 4px 4px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.mebtn .mini{margin:0;width:30px;height:30px}
.file{display:flex;align-items:center;gap:10px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted);cursor:pointer}
.file:focus-within{outline:3px solid var(--sun)}
.top{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.logo .n{font-family:"Baloo Bhaijaan 2",Tajawal,sans-serif;font-weight:800;font-size:26px;line-height:1.1}
.sub{opacity:.8;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:6px;flex:none}
.hb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 12px;position:relative;font-weight:500}
.dot{position:absolute;top:5px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--sun)}
.me{max-width:560px;margin:12px auto 0;font-size:14px;opacity:.9}
.panel{position:relative;z-index:2;background:var(--card);border-radius:20px;padding:16px;margin-top:-38px;box-shadow:0 6px 24px rgba(30,60,50,.10)}
h2{font-family:"Baloo Bhaijaan 2",Tajawal,sans-serif;font-size:22px;margin:0 0 4px;font-weight:800}
h3{font-size:16px;margin:18px 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:14px;padding:4px;margin:16px 0}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 2px;font-weight:500;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--brand-ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;margin-inline-start:4px;padding:0 5px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--card)}
.row .grow{flex:1;min-width:0}
.t{font-weight:700}
.av{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--bg)}
.pts{flex:none;font-weight:700;color:#2B2410;background:var(--sun);border-radius:999px;padding:2px 10px;font-size:14px;white-space:nowrap}
.pts.neg{background:var(--red-bg);color:var(--red)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}
.btn-main{background:var(--brand);color:#fff}
.btn-sun{background:var(--sun);color:#2B2410}
.btn-ok{background:var(--mint);color:#fff}
.btn-no{background:var(--red-bg);color:var(--red)}
.btn-ghost{background:var(--bg);color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.state{flex:none;font-size:13px;font-weight:700;border-radius:10px;padding:6px 10px;white-space:nowrap}
.st-wait{background:var(--wait);color:var(--wait-ink)}
.st-ok{background:var(--mint-bg);color:var(--mint)}
.st-off{background:var(--bg);color:var(--muted)}
.done .t{text-decoration:line-through;opacity:.6}
.form{display:grid;gap:8px;background:var(--bg);border-radius:16px;padding:12px;margin:12px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-width:0}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:14px}
.hero{display:flex;align-items:center;gap:14px}
.coin{flex:none;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F0D9A6,var(--sun) 55%,var(--sun-deep));display:grid;place-items:center;text-align:center;color:#2B2410;box-shadow:inset 0 -6px 0 rgba(0,0,0,.1)}
.coin b{font-family:"Baloo Bhaijaan 2",Tajawal,sans-serif;font-size:32px;line-height:1;display:block}
.coin small{font-size:11px;font-weight:700}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--mint);border-radius:5px;transition:width .4s}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.empty div{font-size:34px}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:4px 8px;flex:none}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:start;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px;margin-top:10px}
.choice:hover{border-color:var(--brand)}
.ce{font-size:32px;flex:none}
.choice b{display:block;font-size:18px}
.choice small{color:var(--muted);font-size:14px}
.demo{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.back{border:0;background:none;color:var(--brand-ink);font-weight:700;padding:4px 0;margin-bottom:8px}
.err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px 10px;font-size:14px}
.note{font-size:13px;color:var(--wait-ink);background:var(--wait);border-radius:10px;padding:8px 10px;margin-top:10px}
.code{font-size:24px;letter-spacing:8px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-top:14px}
.tile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;font-weight:700}
.tile:hover{border-color:var(--brand)}
.tile .e{font-size:26px}
.tile .badge{position:absolute;top:10px;inset-inline-end:10px}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--bg);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--brand-ink)}
.perms{display:grid;gap:8px;background:var(--card);border-radius:12px;padding:10px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:12px;background:var(--mint-bg);color:var(--mint);border-radius:8px;padding:2px 8px}
pre{white-space:pre-wrap;font-family:inherit;margin:6px 0 0}
.preview{background:var(--bg);border-radius:14px;padding:12px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.timer{font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.medal{width:28px;text-align:center;font-weight:800;flex:none}
.tier{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--bg);margin-bottom:8px}
.tier .e{font-size:28px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:8}
#sheet[hidden]{display:none}
.sheet-card{background:var(--card);width:100%;max-width:560px;max-height:82%;overflow:auto;border-radius:22px 22px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.thumb{flex:none;width:52px;height:52px;border-radius:12px;overflow:hidden;border:2px solid var(--line);padding:0;background:var(--bg);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.proof{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:#000;display:block;margin:12px 0}
.fbtypes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fbt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fbt span{font-size:22px}
.fbt[aria-checked="true"]{border-color:var(--brand);background:var(--mint-bg);color:var(--brand-ink)}
.mail{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--brand);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;max-width:92%;transition:transform .3s;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.bar span{transition:none}}
</style>
</head>
<body>
<header id="hdr"></header>
<main class="wrap"><section class="panel" id="app"></section></main>
<div id="sheet" hidden></div>
<input type="file" accept="image/*" id="proofIn" hidden>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

const nextTier=(pts,p,sc)=>S.tiers.filter(t=>t.period===p&&t.scope===sc&&pts<t.threshold).sort((a,b)=>a.threshold-b.threshold)[0];
const ranking=p=>members().map(m=>({m,pts:earned(m.id,p),n:periodLog(m.id,p).length})).sort((a,b)=>b.pts-a.pts);
const compOf=t=>S.completions.filter(c=>c.taskId===t.id&&c.period===pk(t.repeat)&&c.status!=='rejected').pop();
const compActive=c=>!c.ended&&(!c.deadline||Date.now()<c.deadline);
const notesFor=u=>S.notes.filter(n=>n.to==='all'||n.to===u.id);
function pendingCount(){return S.completions.filter(c=>c.status==='pending').length+S.comps.reduce((a,c)=>a+c.entries.filter(e=>e.status==='pending').length,0)}
function addLog(memberId,text,delta){S.log.unshift({memberId,text,delta,ts:Date.now()});S.log=S.log.slice(0,300)}
function note(to,title,body){S.notes.unshift({id:uid(),to,title,body,ts:Date.now(),readBy:[],from:me()?me().name:''});S.notes=S.notes.slice(0,100)}
function ago(ts){const m=Math.floor((Date.now()-ts)/60e3);if(m<1)return 'الآن';if(m<60)return 'قبل '+m+' دقيقة';const h=Math.floor(m/60);if(h<24)return 'قبل '+h+' ساعة';return new Date(ts).toLocaleDateString('ar-SA')}
function fmt(ms){const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':'+p(m):m)+':'+p(x)}

let tt;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2800)}
function sendCode(email,subject,intro){
  const code=String(Math.floor(100000+Math.random()*900000));

}

function resizeImg(file,max){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej();const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

      const c=compOf(t),st=!c?'<span class="state st-off">لم تُنجز</span>':c.status==='pending'?'<span class="state st-wait">⏳ بانتظار</span>':'<span class="state st-ok">منجزة ✓</span>';

comps(){

rewards(){
  const groups=[];['daily','weekly'].forEach(p=>['each','family'].forEach(sc=>{const ts=S.tiers.filter(t=>t.period===p&&t.scope===sc).sort((a,b)=>b.threshold-a.threshold);if(ts.length)groups.push({p,sc,ts})}));
  let h=`<h2>الجوائز والمكافآت</h2><p class="muted">حدّد مستويات بالنقاط. من يصل لمستوى أعلى يستحق مكافأته، ومن يقل عنه يأخذ المستوى الذي تحته.</p>
  <div class="form"><div class="two"><input id="rName" placeholder="المكافأة، مثل: نزهة" aria-label="المكافأة"><select id="rEmoji" aria-label="الأيقونة">${REMOJI.map(e=>`<option>${e}</option>`).join('')}</select></div>
  <div class="two"><label class="muted">الحد الأدنى من النقاط<input id="rThr" type="number" min="1" value="66"></label><label class="muted">الفترة<select id="rPer"><option value="weekly">أسبوعية</option><option value="daily">يومية</option></select></label></div>
  <label class="muted">تُحسب النقاط<select id="rScope"><option value="each">لكل فرد على حدة</option><option value="family">لمجموع نقاط الأسرة</option></select></label>
  <button class="btn btn-main" data-act="addTier">إضافة المستوى</button></div>`;

  const due=[];
  ['daily','weekly'].forEach(p=>{members().forEach(m=>{const t=tierOf(earned(m.id,p),p,'each');if(t)due.push({who:m.name,t,key:t.id+'|'+m.id+'|'+pk(p)})});
    const ft=tierOf(familyEarned(p),p,'family');if(ft)due.push({who:'👨‍👩‍👧 الأسرة كاملة',t:ft,key:ft.id+'|family|'+pk(p)})});
  h+='<h3>المستحقون الآن</h3>'+(due.length?due.map(d=>`<div class="row"><div class="av">${d.t.emoji}</div><div class="grow"><div class="t">${esc(d.t.name)}</div><div class="muted">${esc(d.who)} · ${PLABEL[d.t.period]}</div></div>${S.delivered[d.key]?'<span class="state st-ok">سُلّمت ✓</span>':`<button class="btn btn-ok btn-sm" data-act="deliver" data-id="${d.key}">تم التسليم</button>`}</div>`).join(''):'<p class="muted">لم يصل أحد لأي مستوى بعد.</p>');
  return h;
}
};

function compCard(c,admin,u){
  const act=compActive(c),ents=[...c.entries].sort((a,b)=>a.rank-b.rank);
  const next=Math.max(c.start-c.entries.length,1);
  let h=`<div class="card"><div class="card-h"><b>🏁 ${esc(c.title)}</b>${act?(c.deadline?`<span class="timer" data-deadline="${c.deadline}"></span>`:'<span class="state st-ok">جارية</span>'):'<span class="state st-off">انتهت</span>'}</div>`;
  if(act)h+=`<div class="muted">المركز القادم يحصل على ${next} نقطة</div>`;
  if(u&&act){const mine=c.entries.find(e=>e.memberId===u.id);
    h+=mine?`<div class="state ${mine.status==='approved'?'st-ok':'st-wait'}" style="display:inline-block;margin-top:8px">مركزك ${mine.rank} · ${mine.points} نقطة ${mine.status==='approved'?'✓':'⏳'}</div>`:`<button class="btn btn-sun" style="width:100%;margin-top:8px" data-act="compDone" data-id="${c.id}">أنجزت!</button>`}
  h+=ents.length?ents.map(e=>{const k=user(e.memberId);return `<div class="row" style="margin:8px 0 0"><div class="medal">${medal(e.rank-1)}</div><div class="grow">${MINI(k)}${esc(k.name)}</div>${e.status==='rejected'?'<span class="state st-off">مرفوض</span>':`<span class="pts">${e.points}${e.status==='pending'?' ⏳':''}</span>`}</div>`}).join(''):'<p class="muted" style="margin-top:6px">لم ينجز أحد بعد.</p>';
  if(admin&&act)h+=`<button class="btn btn-ghost btn-sm" style="margin-top:8px" data-act="endComp" data-id="${c.id}">إنهاء المسابقة</button>`;
  return h+'</div>';
}

function reportText(){
  const r=ranking('daily');if(!r.length)return 'لا يوجد أعضاء بعد.';
  return `ترتيب إنجاز اليوم — ${new Date().toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'})}\n\n`+r.map((x,i)=>`${medal(i)} ${x.m.name}: ${x.pts} نقطة (${x.n} إنجاز)`).join('\n')+`\n\nمجموع الأسرة: ${familyEarned('daily')} نقطة`;
}

// ---- member
function memberView(u){
  const ts=S.tasks.filter(t=>t.memberId===u.id),done=ts.filter(t=>{const c=compOf(t);return c&&c.status==='approved'}).length;
  const pct=ts.length?Math.round(done/ts.length*100):0;
  const unread=notesFor(u).filter(n=>!n.readBy.includes(u.id)).length;
  const openC=S.comps.filter(c=>compActive(c)&&!c.entries.some(e=>e.memberId===u.id)).length;
  let h=`<div class="hero"><div class="coin"><div><b>${earned(u.id,'weekly')}</b><small>نقاط الأسبوع</small></div></div>
    <div style="flex:1;min-width:0"><h2>أهلاً ${esc(u.name)}</h2><div class="muted">اليوم: ${earned(u.id,'daily')} نقطة · أنجزت ${done} من ${ts.length}</div><div class="bar"><span style="width:${pct}%"></span></div></div></div>`+
    tabs([['tasks','مهامي'],['comps','المسابقات',openC],['rewards','المكافآت'],['notes','التنبيهات',unread]],ui.mtab,'mtab');
  if(ui.mtab==='tasks'){
    if(!ts.length)return h+empty('🌤️','لا توجد مهام لك الآن.');
    return h+ts.map(t=>{const c=compOf(t);
      const s=!c?`<div class="acts"><button class="btn btn-ghost" data-act="donePhoto" data-id="${t.id}" aria-label="أنجزتها مع صورة" title="أنجزتها مع صورة">📷</button><button class="btn btn-sun" data-act="done" data-id="${t.id}">أنجزتها</button></div>`:c.status==='pending'?`<span class="state st-wait">بانتظار الموافقة ⏳${c.photo?' 📷':''}</span>`:`<span class="state st-ok">+${c.points} ✓</span>`;
      return `<div class="row ${c&&c.status==='approved'?'done':''}"><div class="grow"><div class="t">${esc(t.title)}</div><div class="muted">${t.repeat==='daily'?'اليوم':'هذا الأسبوع'} · ${t.points} نقطة</div></div>${s}</div>`}).join('')+'<p class="muted" style="margin-top:10px">📷 تقدر ترفق صورة للمهمة كإثبات، وهذا اختياري.</p>';
  }
  if(ui.mtab==='comps'){
    const act=S.comps.filter(compActive),old=S.comps.filter(c=>!compActive(c)).slice(0,5);
    if(!S.comps.length)return h+empty('🏁','لا توجد مسابقات الآن. ترقّب التنبيهات!');
    return h+act.map(c=>compCard(c,false,u)).join('')+(old.length?'<h3>مسابقات سابقة</h3>'+old.map(c=>compCard(c,false,u)).join(''):'');
  }
  if(ui.mtab==='rewards'){
    let out='';
    ['daily','weekly'].forEach(p=>['each','family'].forEach(sc=>{
      if(!S.tiers.some(t=>t.period===p&&t.scope===sc))return;
      const pts=sc==='each'?earned(u.id,p):familyEarned(p),cur=tierOf(pts,p,sc),nx=nextTier(pts,p,sc);
      out+=`<h3>${p==='daily'?'مكافأة اليوم':'مكافأة الأسبوع'}${sc==='family'?' · للأسرة كاملة':''}</h3><div class="tier"><span class="e">${cur?cur.emoji:'🎯'}</span><div style="flex:1">
        <div>${sc==='each'?'نقاطك':'نقاط الأسرة'}: <b>${pts}</b></div>
        <div class="muted">${cur?'استحققت: '+esc(cur.name):'لم تصل لأي مستوى بعد'}${nx?` · باقي ${nx.threshold-pts} نقطة لـ${nx.emoji} ${esc(nx.name)}`:''}</div>
        ${nx?`<div class="bar"><span style="width:${Math.min(100,Math.round(pts/nx.threshold*100))}%"></span></div>`:''}</div></div>`}));
    return h+(out||empty('🎁','لم يحدد المسؤول مكافآت بعد.'));
  }
  const ns=notesFor(u);
  return h+(ns.length?ns.map(n=>`<div class="card"><div class="card-h"><b>${esc(n.title)}</b><span class="muted">${ago(n.ts)}</span></div><pre>${esc(n.body)}</pre></div>`).join(''):empty('🔔','لا توجد تنبيهات.'));
}

// ---- actions
const A={
  demo:()=>{S=demoSeed();ui={...UI0};toast('دخلت كمسؤول الأسرة في أسرة تجريبية')},
  wipe:()=>{if(!confirm('مسح كل بيانات النموذج والبدء من جديد؟'))return false;S=blank();ui={...UI0}},
  choose:r=>{ui.role=r;ui.step='email';ui.err='';ui.email=''},
  back:()=>{ui.step=ui.step==='code'?'email':'choose';ui.err=''},
  reqCode:()=>{
    const email=val('obEmail').trim().toLowerCase();ui.email=email;ui.err='';
    if(!EMAIL.test(email)){ui.err='اكتب بريداً إلكترونياً صحيحاً.';return}
    const u=S.users.find(x=>x.email===email);
    if(ui.role==='admin'){
      if(u&&u.role==='member'){ui.err='هذا البريد مضاف كعضو. ارجع واختر «أحد أفراد الأسرة».';return}
      if(!u){
        if(S.family){ui.err='هذا البريد غير مضاف كمسؤول في '+S.family.name+'. اطلب من مسؤول الأسرة إضافتك.';return}
        const fam=val('obFam').trim(),nm=val('obName').trim();
        if(!fam||!nm){ui.err='اكتب اسم الأسرة واسمك.';return}
        ui.setup={fam,nm};
      }
    }else{
      if(u&&u.role!=='member'){ui.err='هذا البريد مسجّل كمسؤول. ارجع واختر «مسؤول الأسرة».';return}
      if(!u){ui.err='هذا البريد غير مضاف لأي أسرة. اطلب من مسؤول أسرتك إضافة بريدك من لوحته.';return}
    }
    const c=S.codes[email];
    if(!c||Date.now()-c.ts>30*60e3)sendCode(email,'كود الدخول إلى أسرتي','هذا كود التحقق لتسجيل الدخول إلى تطبيق أسرتي.');
    else toast('الكود مُرسل مسبقاً إلى بريدك');
    ui.step='code';
  },
  resend:()=>{sendCode(ui.email,'كود الدخول إلى أسرتي','كود تحقق جديد لتسجيل الدخول إلى تطبيق أسرتي.');ui.err=''},
  verify:()=>{
    const c=S.codes[ui.email],v=val('obCode').trim();
    if(!c||c.code!==v){ui.err='الكود غير صحيح. تأكد منه أو اطلب كوداً جديداً.';return}
    if(Date.now()-c.ts>30*60e3){ui.err='انتهت صلاحية الكود. اطلب كوداً جديداً.';return}
    delete S.codes[ui.email];
    let u=S.users.find(x=>x.email===ui.email);
    if(!u){S.family={name:ui.setup.fam};u={id:uid(),email:ui.email,name:ui.setup.nm,avatar:'dad',role:'owner',perms:{},status:'active'};S.users.push(u)}
    const first=u.status!=='active';u.status='active';S.session=u.id;ui={...UI0};
    toast(first?'تم ربطك بـ'+S.family.name+' ✓':'أهلاً '+u.name);
  },
  signout:()=>{S.session=null;ui={...UI0}},
  openMail:()=>{ui.mail=true;ui.avFor=null;ui.fb=false},
  openFb:()=>{ui.fb=true;ui.mail=false;ui.avFor=null},closeFb:()=>{ui.fb=false},
  fbType:k=>{ui.fbType=k;document.querySelectorAll('[data-act="fbType"]').forEach(b=>b.setAttribute('aria-checked',b.dataset.id===k));return false},
  sendFb:()=>{const text=val('fbText').trim(),u=me();
    if(text.length<5){toast('اكتب رسالتك أولاً');return false}
    const email=u?u.email:val('fbEmail').trim().toLowerCase();
    if(!u&&email&&!EMAIL.test(email)){toast('البريد غير صحيح، صحّحه أو اتركه فارغاً');return false}
    const t=FBT.find(x=>x[0]===ui.fbType);
    S.feedback.unshift({id:uid(),type:ui.fbType,text,userId:u?u.id:null,email,ts:Date.now()});
    S.outbox.unshift({id:uid(),to:SUPPORT,subject:`[${t[2]}] من ${u?u.name:'زائر'}${S.family&&u?' — '+S.family.name:''}`,
      body:`${text}\n\n— المرسل: ${u?u.name+' ('+roleLabel(u)+')':'مستخدم غير مسجّل'}\n— البريد: ${email||'لم يُذكر'}\n— الأسرة: ${u&&S.family?S.family.name:'—'}\n— الجهاز: ${navigator.userAgent.includes('Mobile')?'جوال':'كمبيوتر'}`,ts:Date.now()});
    ui.fb=false;ui.fbType='suggestion';toast('وصلت رسالتك ✓ شكراً لمساعدتنا في تحسين أسرتي')},closeMail:()=>{ui.mail=false},
  go:id=>{ui.screen=id;ui.editTask=null;window.scrollTo(0,0)},
  mtab:id=>{ui.mtab=id;if(id==='notes'){const u=me();notesFor(u).forEach(n=>{if(!n.readBy.includes(u.id))n.readBy.push(u.id)})}},
  rtab:id=>{ui.rtab=id},
  addMember:()=>{
    const nm=val('mName').trim(),em=val('mEmail').trim().toLowerCase();
    if(!nm||!EMAIL.test(em)){toast('اكتب الاسم وبريداً صحيحاً');return false}
    if(S.users.some(u=>u.email===em)){toast('هذا البريد مضاف مسبقاً');return false}
    S.users.push({id:uid(),email:em,name:nm,avatar:ui.newAv.member,role:'member',perms:{},status:'invited'});
    sendCode(em,'دعوة للانضمام إلى '+S.family.name,`أضافك ${me().name} إلى ${S.family.name} في تطبيق أسرتي.\nللربط: افتح التطبيق، اختر «أحد أفراد الأسرة»، أدخل بريدك ثم هذا الكود.`);
  },
  pickNew:v=>{const [f,k]=v.split('|');ui.newAv[f]=k;document.querySelectorAll(`[data-act="pickNew"][data-id^="${f}|"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===v));return false},
  editAv:id=>{ui.avFor=id;ui.mail=false;ui.fb=false},closeAv:()=>{ui.avFor=null},
  setAv:v=>{const [id,k]=v.split('|'),u=S.users.find(x=>x.id===id);if(u){u.avatar=k;toast(id===S.session?'تغيّر رمزك ✓':'تغيّر رمز '+u.name+' ✓')}ui.avFor=null},
  addAdmin:()=>{
    const nm=val('aName').trim(),em=val('aEmail').trim().toLowerCase();
    if(!nm||!EMAIL.test(em)){toast('اكتب الاسم وبريداً صحيحاً');return false}
    if(S.users.some(u=>u.email===em)){toast('هذا البريد مضاف مسبقاً');return false}
    const perms={};PERMS.forEach(([k])=>perms[k]=!!($('p_'+k)||{}).checked);
    S.users.push({id:uid(),email:em,name:nm,avatar:ui.newAv.admin,role:'admin',perms,status:'invited'});
    sendCode(em,'تمت إضافتك مسؤولاً في '+S.family.name,`أضافك ${me().name} مسؤولاً في ${S.family.name} على تطبيق أسرتي.\nللربط: افتح التطبيق، اختر «مسؤول الأسرة»، أدخل بريدك ثم هذا الكود.`);
  },
  resendInvite:id=>{const u=user(id);sendCode(u.email,'تذكير: دعوة للانضمام إلى '+S.family.name,`للربط: افتح تطبيق أسرتي، اختر «${u.role==='member'?'أحد أفراد الأسرة':'مسؤول الأسرة'}»، أدخل بريدك ثم هذا الكود.`)},
  removeUser:id=>{if(!confirm('إزالة '+user(id).name+' من الأسرة؟'))return false;S.users=S.users.filter(u=>u.id!==id);S.tasks=S.tasks.filter(t=>t.memberId!==id)},
  preset:p=>{$('tTitle').value=p;return false},
  addTask:()=>{const title=val('tTitle').trim(),pts=parseInt(val('tPts'))||0,who=val('tWho'),rep=val('tRep');
    if(!title||pts<1){toast('اكتب اسم المهمة ونقاطاً أكبر من صفر');return false}
    (who==='all'?members().map(m=>m.id):[who]).forEach(mid=>S.tasks.push({id:uid(),title,memberId:mid,points:pts,repeat:rep}));toast('أُضيفت المهمة ✓')},
  editTask:id=>{ui.editTask=id},cancelEdit:()=>{ui.editTask=null},
  saveTask:id=>{const t=S.tasks.find(x=>x.id===id);t.title=val('eTitle').trim()||t.title;t.points=parseInt(val('ePts'))||t.points;t.repeat=val('eRep');t.memberId=val('eWho')||t.memberId;ui.editTask=null;toast('حُفظت التعديلات ✓')},
  delTask:id=>{S.tasks=S.tasks.filter(t=>t.id!==id)},
  done:(id,photo)=>{const t=S.tasks.find(x=>x.id===id);if(!t||compOf(t))return;S.completions.push({id:uid(),taskId:t.id,memberId:t.memberId,title:t.title,points:t.points,period:pk(t.repeat),status:'pending',ts:Date.now(),photo:photo||null});toast(photo?'أُرسلت مع الصورة للمسؤول ⏳':'أُرسلت للمسؤول بانتظار الموافقة ⏳')},
  donePhoto:id=>{ui.proofFor=id;const i=$('proofIn');i.value='';i.click();return false},
  viewPhoto:id=>{ui.viewPhoto=id;ui.mail=false;ui.fb=false;ui.avFor=null},closePhoto:()=>{ui.viewPhoto=null},
  approve:id=>{const c=S.completions.find(x=>x.id===id);c.status='approved';delete c.photo;ui.viewPhoto=null;addLog(c.memberId,'إنجاز: '+c.title,c.points);toast(`تمت الموافقة! +${c.points} نقاط لـ${user(c.memberId).name} 🎉`)},
  reject:id=>{const c=S.completions.find(x=>x.id===id);c.status='rejected';delete c.photo;ui.viewPhoto=null;toast('أُعيدت المهمة ليحاول مرة أخرى')},
  addComp:()=>{const title=val('cTitle').trim(),start=parseInt(val('cStart'))||20,mins=parseInt(val('cMins'))||0;
    if(!title){toast('اكتب اسم المسابقة');return false}
    S.comps.unshift({id:uid(),title,start,deadline:mins>0?Date.now()+mins*60e3:null,ended:false,ts:Date.now(),entries:[]});
    note('all','🏁 مسابقة جديدة',`${title}\nأول من ينجز يحصل على ${start} نقطة، والتالي أقل بنقطة.${mins>0?`\nالوقت المتاح: ${mins} دقيقة.`:''}`);toast('انطلقت المسابقة وأُبلغ الجميع 🏁')},
  endComp:id=>{S.comps.find(c=>c.id===id).ended=true;toast('انتهت المسابقة')},
  compDone:id=>{const c=S.comps.find(x=>x.id===id),u=me();
    if(!compActive(c)){toast('انتهى وقت المسابقة');return}
    if(c.entries.some(e=>e.memberId===u.id))return;
    const rank=c.entries.length+1,pts=Math.max(c.start-(rank-1),1);
    c.entries.push({memberId:u.id,ts:Date.now(),rank,points:pts,status:'pending'});toast(`مركزك ${rank} — ${pts} نقطة بانتظار الموافقة`)},
  approveEntry:k=>{const [cid,mid]=k.split('|'),c=S.comps.find(x=>x.id===cid),e=c.entries.find(x=>x.memberId===mid);e.status='approved';addLog(mid,'مسابقة: '+c.title+' (المركز '+e.rank+')',e.points);toast(`+${e.points} نقطة لـ${user(mid).name} 🏆`)},
  rejectEntry:k=>{const [cid,mid]=k.split('|'),c=S.comps.find(x=>x.id===cid);c.entries.find(x=>x.memberId===mid).status='rejected'},
  sendReport:()=>{note('all','🏆 ترتيب إنجاز اليوم',reportText());toast('أُرسل التقرير لكل الأعضاء')},
  sendAlert:()=>{const to=val('aTo'),body=val('aBody').trim();if(!body){toast('اكتب نص التنبيه');return false}
    note(to,'🔔 تنبيه من '+me().name,body);toast(to==='all'?'أُرسل التنبيه لكل الأعضاء':'أُرسل التنبيه إلى '+user(to).name)},
  addTier:()=>{const name=val('rName').trim(),thr=parseInt(val('rThr'))||0;if(!name||thr<1){toast('اكتب اسم المكافأة وحدّاً أدنى من النقاط');return false}
    S.tiers.push({id:uid(),name,emoji:val('rEmoji')||'🎁',threshold:thr,period:val('rPer'),scope:val('rScope')});toast('أُضيف المستوى ✓')},
  delTier:id=>{S.tiers=S.tiers.filter(t=>t.id!==id)},
  deliver:k=>{S.delivered[k]=true;toast('سُجّل التسليم ✓')}
};

document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){ui.mail=false;ui.avFor=null;ui.fb=false;ui.viewPhoto=null;render();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=A[b.dataset.act];if(!f)return;
  if(f(b.dataset.id)===false)return;save();render();
});
document.addEventListener('change',e=>{const p=e.target.dataset&&e.target.dataset.perm;if(!p)return;
  const [id,k]=p.split('|'),u=S.users.find(x=>x.id===id);if(!u)return;u.perms=u.perms||{};u.perms[k]=e.target.checked;save();toast('حُدّثت صلاحيات '+u.name)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName==='TEXTAREA')return;
  const m={obEmail:'reqCode',obCode:'verify'}[e.target.id];if(m){A[m]();save();render()}});
$('proofIn').addEventListener('change',e=>{const f=e.target.files[0],id=ui.proofFor;if(!f||!id)return;
  resizeImg(f,720).then(ph=>{A.done(id,ph);if(!save()){const c=S.completions.find(x=>x.taskId===id&&x.status==='pending');if(c)delete c.photo;save();toast('الذاكرة ممتلئة، أُرسلت المهمة بدون الصورة')}ui.proofFor=null;render()},()=>toast('تعذّر قراءة الصورة، جرّب صورة أخرى'))});
function tick(){document.querySelectorAll('[data-deadline]').forEach(el=>{const ms=+el.dataset.deadline-Date.now();el.textContent=ms>0?'⏱ '+fmt(ms):'انتهى الوقت'})}
setInterval(tick,1000);
render();
</script>
</body>
</html>
